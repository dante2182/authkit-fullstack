name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_auth_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # El cliente de Prisma se genera en `src/generated` (ignorado por git).
      - name: Generate Prisma client
        run: pnpm --filter api db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_auth_test

      # PostgreSQL ya viene instalado en el runner: se arranca sin contenedores.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service || sudo service postgresql start
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # El build es el único paso que valida el bundling del frontend y el
      # `tsc` de emit de la API: sin él, un import roto solo se ve al desplegar.
      - run: pnpm build
